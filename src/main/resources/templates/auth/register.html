<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
<main class="auth-panel">
    <h1>Create account</h1>
    <form method="post" action="/register" th:object="${form}" class="stack">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>Name <input th:field="*{name}" required></label>
        <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        <label>Email <input type="email" th:field="*{email}" required></label>
        <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        <label>Password <input type="password" th:field="*{password}" required minlength="8"></label>
        <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="/login">Sign in</a></p>
</main>
</body>
</html>
